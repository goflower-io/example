syntax="proto3";
option go_package = "/api";

service UserService { 
    rpc CreateUser(User)returns(User);
    rpc DeleteUser(UserId)returns(UserEmpty);
    rpc UpdateUser(UpdateUserReq)returns(User);
    rpc GetUser(UserId)returns(User);
    rpc ListUsers(ListUsersReq)returns(ListUsersResp);
    rpc ListUsersMore(ListUsersMoreReq)returns(ListUsersMoreResp);
}

message User {
    //
    int64	id = 1 ; // @gotags: validate:"oneof 1 2 3"
    //
    string	name = 2 ; // @gotags: validate:"max=100,min=10"
    //
    int64	age = 3 ; // @gotags: validate:"max=140,min=18"
    //
    int64	ctime = 4 ;
    //
    int64	mtime = 5 ;  
}

enum UserField{
    User_unknow = 0;
    User_id = 1;
    User_name = 2;
    User_age = 3;
    User_ctime = 4;
    User_mtime = 5;   
}

message UserId{
    int64 id = 1 ; 
}
message UserEmpty{}
message UpdateUserReq{
    User user = 1 ;
    repeated UserField masks  = 2 ;
}


message ListUsersReq{
    int32 page = 1 ;
    int32 page_size = 2 ;
    repeated UserOrderBy orderbys = 3 ; 
    repeated UserFilter filters = 5 ; 
    repeated UserField select_fields = 6; 
}
message UserOrderBy {
  UserField field = 1;
  bool desc = 2;
} 
message UserFilterOr{
 repeated UserFilter filters = 1;
}
message UserFilter{
    UserField field = 1;
    string op = 2;
    string val = 3;
}

message ListUsersResp{
    repeated User users = 1 ; 
    int32 total_count = 2 ;   
    int32 page_count = 3 ; 
    int32 page_size = 4;
    int32 page = 5;
}

message ListUsersMoreReq{
    string page_token = 1;  
    int32 page_size = 2 ;
    UserCursor cursor = 3;// 首页查询需要，之后使用page_token
}
message UserCursor{
    repeated UserFilterOr next_page_filters = 1 ; 
    repeated UserOrderBy orderbys = 3 ; 
    repeated UserFilter filters = 5 ; 
    repeated UserField select_fields = 6; 
}
message ListUsersMoreResp{
    string next_page_token = 1;
    repeated User users = 2 ; 
    bool has_more = 3;
}
